<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webmail Links</title>
    <script src="./src/script.js" defer></script>
</head>
<body>
    <table border="1">
        <tr>
            <td onMouseOver="pintar(this, '#f00')" onMouseOut="pintar(this, '#fff')">
                <a href="https://mail.google.com/" target="_blank">Gmail</a>
            </td>
            <td onMouseOver="pintar(this, '#0fe')" onMouseOut="pintar(this, '#fff')">
                <a href="https://outlook.live.com/" target="_blank">Hotmail</a>
            </td>
            <td onMouseOver="pintar(this, '#00f')" onMouseOut="pintar(this, '#fff')">
                <a href="https://mail.yahoo.com/" target="_blank">Yahoo!</a>
            </td>
        </tr>
    </table>
</body>
</html>
